services:
  db:
    image: postgres:16-alpine
    container_name: hospital_postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hospital_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: hospital_fastapi_app
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/hospital_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: